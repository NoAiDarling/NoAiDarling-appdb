;
; WineHQ AppDB PHP Settings
; Note: restart php-fpm service if these settings are changed
;

; Tell PHP how we want to handle global vars
register_globals=off

; Tell PHP that we do NOT want to set magic quotes
magic_quotes_gpc=off
magic_quotes_runtime=off

; Tell PHP we want to use output compression
zlib.output_compression=on

; Allow uploads of up to 100 megabytes
post_max_size="10M"
upload_max_filesize="10M"
max_execution_time="60"
max_input_time="-1"

; Allow PHP to use up to 48 meg of RAM
memory_limit=48M

; Tell PHP the default timezone
date.timezone="America/Chicago"

; Disable PHP Email debug header
mail.add_x_header="0"

; PHP debugging
error_reporting="7"
html_errors="1"
display_errors="1"
xdebug.default_enable="0"

; PHP lang tweaks
allow_call_time_pass_reference=1
short_open_tag=0
register_long_arrays=0

; make sure gc_probability is non-zero, we want php to take care of
; session cleanup for us
session.gc_probability=1

; lower the probability of calling garbage collection
; the appdb gets so many hits we want to increase the divisor above 100
session.gc_divisor=2000
